<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#102e48"><title>Organisator · Pubquiz</title><link rel="icon" href="assets/favicon-heynkensort-blauw.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="assets/apple-touch-icon-heynkensort-blauw.png" sizes="180x180"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="organisator.css"><link rel="stylesheet" href="apres-ski.css"><script src="organisator.js" type="module"></script></head>
<body class="organizer-body"><div id="organizer"><main class="access-page"><span class="brand-mark">PQ</span><h1>Quizbeheer laden…</h1></main></div><div id="toast" role="status" aria-live="polite" hidden></div><dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-message"></p><div><button class="button outline" value="cancel">Annuleren</button><button class="button primary" value="confirm" id="confirm-button">Doorgaan</button></div></form></dialog><dialog id="reset-answers-dialog" aria-labelledby="reset-answers-title"><form id="reset-answers-form"><h2 id="reset-answers-title">Alle antwoorden resetten</h2><p>Dit wist alle ingevulde antwoorden en toegekende punten van alle teams, inclusief uitgesloten teams. Alle rondes worden heropend. Teams, leden, bingokaartkoppelingen, vragen en punteninstellingen blijven bewaard.</p><label for="reset-password">Typ <strong>pubquiz</strong> om te bevestigen</label><input id="reset-password" name="password" type="text" required pattern="pubquiz" autocomplete="off" spellcheck="false" autocapitalize="none"><p id="reset-answers-error" role="alert" hidden></p><div class="reset-dialog-actions"><button type="button" class="button outline" id="cancel-reset-answers">Annuleren</button><button type="submit" class="button primary" id="confirm-reset-answers" disabled>Alle antwoorden wissen</button></div></form></dialog><dialog id="bingo-media"><header><h2 id="bingo-media-title"></h2><button class="button outline" id="close-bingo-media">Sluiten ✕</button></header><img id="bingo-media-image" alt=""></dialog><noscript>Schakel JavaScript in om het quizbeheer te gebruiken.</noscript></body></html>
