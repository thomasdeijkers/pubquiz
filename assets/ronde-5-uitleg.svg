<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000"><rect width="1500" height="1000" fill="#f7f5ee"/><rect width="1500" height="240" fill="#102e48"/><text x="90" y="90" fill="#e4b57f" font-family="Arial,sans-serif" font-size="23" letter-spacing="6">RONDE 5</text><text x="90" y="175" fill="#fff" font-family="Arial,sans-serif" font-weight="bold" font-size="68">MUZIEKBINGO</text><g font-family="Arial,sans-serif" fill="#173348"><text x="90" y="350" font-size="38" font-weight="bold">Luister · herken · streep af</text><text x="90" y="445" font-size="29">1. Pak de bingokaart die bij jullie team hoort.</text><text x="90" y="525" font-size="29">2. De DJ speelt korte muziekfragmenten af.</text><text x="90" y="605" font-size="29">3. Herken je een nummer? Streep het af op je kaart.</text><text x="90" y="685" font-size="29">4. De quizmaster vertelt welke combinatie je nodig hebt.</text><text x="90" y="765" font-size="29">5. Combinatie compleet? Roep BINGO!</text></g><rect x="90" y="835" width="1320" height="85" rx="6" fill="#dceaf0"/><text x="125" y="888" fill="#173348" font-family="Arial,sans-serif" font-size="25">Laat je bingo controleren door de organisatie. Veel plezier!</text></svg>
