name: Publiceer pubquiz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controleer inhoud en maak publicatiemap
        run: |
          node --test tests/scoring.test.mjs tests/organisator.test.mjs tests/answer-sheets.test.mjs tests/table-card-pdf.test.mjs
          node --check organisator.js
          node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publiceer
        id: deployment
        uses: actions/deploy-pages@v4
